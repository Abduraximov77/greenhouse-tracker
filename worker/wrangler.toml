# AgroLedger server. Deployed by .github/workflows/deploy.yml (the database id is filled in there).
name = "agroledger-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "agroledger"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[triggers]
# every hour at :07 — weather alerts; Sundays also the weekly backup
crons = ["7 * * * *"]

[vars]
APP_ORIGIN = "https://agroledger-app.github.io"
BOT_USERNAME = "agroledger_family_bot"
