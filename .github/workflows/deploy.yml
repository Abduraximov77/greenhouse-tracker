# Builds the website and publishes it to the gh-pages branch (GitHub Pages)
# every time something is saved to main, and every few hours so the
# Central Bank of Uzbekistan exchange rates published with it stay current.
name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Tashkent time 06:10, 09:10, 12:10, 15:10, 18:10 (the bank publishes new rates each day)
    - cron: '10 1,4,7,10,13 * * *'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Put the server on Cloudflare (accounts, family sharing, Telegram alerts)
        id: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        # on the timed runs (exchange rates) the server is left as it is; only its address is looked up
        run: node scripts/deploy-api.mjs ${{ github.event_name == 'schedule' && '--url-only' || '' }}
      - name: Get Central Bank of Uzbekistan rates
        run: node scripts/fetch-cbu-rates.mjs
      - run: npm run build
        env:
          VITE_API_URL: ${{ steps.api.outputs.url }}
          VITE_BOT_USERNAME: ${{ steps.api.outputs.bot }}
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
